<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Book Nook</title>
  <meta name="description" content="Find free books, scan the ones you own, and read them.">
  <meta name="theme-color" content="#FBF7F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1B1917" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Book Nook">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <main id="view" tabindex="-1"></main>
    <nav id="tabs" aria-label="Sections">
      <a href="#shelf" data-tab="shelf"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16.5 6.2l3.8-1 3.2 14.6-3.8 1z" transform="translate(-1.5 0)"/></svg><span>My Books</span></a>
      <a href="#find" data-tab="find"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke-width="2.2"/><path d="M15.5 15.5L21 21" fill="none" stroke-width="2.2" stroke-linecap="round"/></svg><span>Find Books</span></a>
      <a href="#scan" data-tab="scan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3" fill="none" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="12" r="3.4" fill="none" stroke-width="2.2"/></svg><span>Scan a Book</span></a>
      <a href="#more" data-tab="more"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke-width="2.2"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18" fill="none" stroke-width="2"/></svg><span>More Libraries</span></a>
    </nav>
  </div>
  <div id="reader" hidden></div>
  <div id="sheet" hidden></div>
  <div id="busy" hidden><div class="busy-card"><div class="spinner"></div><p id="busy-text"></p></div></div>
  <div id="toast" role="status" hidden></div>
  <script src="vendor/jszip.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
